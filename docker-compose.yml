version: '3'

networks:
  rede-fraude:
    driver: bridge

volumes:
  dados-kafka:
    driver: local

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: broker-kafka
    ports:
      - "9092:9092"
    networks:
      - rede-fraude
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker-kafka:29093'
      
      # Listeners configurados
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29094,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://broker-kafka:29094,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      
      # CORREÇÃO AQUI: Diz ao Kafka qual listener usar para comunicação interna
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - dados-kafka:/var/lib/kafka/data
