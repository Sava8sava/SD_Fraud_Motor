networks:
  rede-fraude:
    driver: bridge

volumes:
  dados-kafka:
    driver: local

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: broker-kafka
    ports:
      - "9092:9092"
    networks:
      - rede-fraude
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker-kafka:29093'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29094,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://broker-kafka:29094,EXTERNAL://127.0.0.1:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - dados-kafka:/var/lib/kafka/data

  generator:
    build: .
    container_name: app-gerador
    restart: always
    # ADICIONADO AQUI: Desativa o buffer de logs do Python
    environment:
      PYTHONUNBUFFERED: 1
    command: >
      bash -c "echo 'Aguardando o Kafka estabilizar...' && 
               while ! timeout 1 bash -c 'cat < /dev/null > /dev/tcp/broker-kafka/29094' 2>/dev/null; do sleep 1; done; 
               echo 'Kafka Pronto! Iniciando o Gerador...' && 
               python generator/producer.py"
    networks:
      - rede-fraude
    depends_on:
      - kafka

  processor:
    build: .
    container_name: app-motor-antifraude
    restart: always
    # ADICIONADO AQUI: Desativa o buffer de logs do Python
    environment:
      PYTHONUNBUFFERED: 1
    command: >
      bash -c "echo 'Aguardando o Kafka estabilizar...' && 
               while ! timeout 1 bash -c 'cat < /dev/null > /dev/tcp/broker-kafka/29094' 2>/dev/null; do sleep 1; done; 
               echo 'Kafka Pronto! Iniciando o Motor Antifraude...' && 
               python processor/consumer.py"
    networks:
      - rede-fraude
    depends_on:
      - kafka 
